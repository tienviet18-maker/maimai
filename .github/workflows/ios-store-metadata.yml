name: iOS App Store listing

# Uploads the App Store text and screenshots in fastlane/ to App Store Connect.
# It never uploads a binary and never submits for review.
# Uses the same repository secrets as ios-testflight.yml.

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "App Store version the listing belongs to"
        required: true
        default: "2.0.0"

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Write API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 - "$RUNNER_TEMP/asc_key.json" <<'PY'
          import base64, json, os, re, sys
          raw = os.environ["ASC_KEY_P8"].replace("\r", "").strip()
          if "BEGIN" not in raw:
              try:
                  raw = base64.b64decode(re.sub(r"\s+", "", raw)).decode().strip()
              except Exception:
                  pass
          m = re.search(r"-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----", raw, re.S)
          if not m:
              print("::error::ASC_KEY_P8 is not the AuthKey .p8 text")
              sys.exit(1)
          body = re.sub(r"\s+", "", m.group(1))
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i + 64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n"
          json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"], "key": pem, "in_house": False}, open(sys.argv[1], "w"))
          PY

      - name: Upload listing
        run: |
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/asc_key.json" \
            --app_identifier jp.vimai.maimai \
            --platform ios \
            --app_version "${{ inputs.app_version }}" \
            --metadata_path fastlane/metadata \
            --screenshots_path fastlane/screenshots \
            --skip_binary_upload true \
            --overwrite_screenshots true \
            --submit_for_review false \
            --run_precheck_before_submit false \
            --force true
